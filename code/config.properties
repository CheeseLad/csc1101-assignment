! WAREHOUSE PROPERTIES CONTROL PANEL !

# Inspired from https://en.wikipedia.org/wiki/.properties and https://www.browserstack.com/guide/config-file-in-java


! WAREHOUSE ENVIRONMENT !


# Setting for for threads of each worker type
# Set below to positive integer values, default if not set is 1
DELIVERERS_COUNT = 1
STOCKERS_COUNT = 3
PICKERS_COUNT = 10

# Generate categories for boxes and sections
# Set to comma-separated string values, at least one is required, default if not set is "electronics,books,medicines,clothes,tools"
CATEGORIES = electronics,books,medicines,clothes,tools


! SIZE RESTRICTIONS !


# Set to a positive integer, default if not set is 10
DELIVERY_SIZE = 10

# Set to a positive integer or 0 for default value of Math.floor((STOCKERS_COUNT + PICKERS_COUNT) / 2.0)   
# TROLLEY_POOL_SIZE = 0

# Set to a positive integer or 0 for no restriction, default if not set is 0
SECTION_CAPACITY = 100

# Set to a positive integer or 0, default if not set is 5
INITIAL_SECTION_SIZES = 5


! TICK CONTROL !


# Tracks the time in miliseconds a tick lasts
# Set to a positive integer, default if not set is 50
TICK_TIME_SIZE = 50

# Number of ticks the simulation runs for
# Set to a positive integer, default if not set is 1000
TOTAL_RUNTIME_TICKS = 1005


! PROBABILITY CONTROL !


# Optional seed for deterministic runs
# Set to a positive integer, run is "random" if not set
SEED = 12345

# Float probabilities of a delivery or picker event per tick, default if not set is 0.01 for deliverers and 0.1 for pickers
# Actual percentage probability is calculated by multiplying these by 100 (e.g. 0.01 is 1% chance per tick to occur)
DELIVERY_PROBABILITY = 0.01
PICKER_PROBABILITY = 0.1


! DEBUG !

# Set to "true" for more detailed debugging information, default if not set is "false"
VERBOSE = false
